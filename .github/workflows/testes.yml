name: Testes do SafraSmart

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: safrasmart_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teste -d safrasmart_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - name: Testes Python com SQLite
        run: python -m pytest -q
      - name: Integração com PostgreSQL descartável
        run: python -m pytest -q tests/test_api.py tests/test_talhoes.py tests/test_regional.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://teste:teste@127.0.0.1:5432/safrasmart_teste
      - run: npm test
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python tests/e2e_dashboard.py
